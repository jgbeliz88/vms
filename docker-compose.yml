version: '3.8'

services:
  vms:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: vms-dev
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - /etc/ssl/certs/ca-cinconet-jules.crt:/etc/ssl/certs/ca-cinconet-jules.crt:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
