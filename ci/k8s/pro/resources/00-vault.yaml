---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vms-vault
spec:
  provider: vault
  secretObjects:
    - secretName: admincreds
      type: Opaque
      data:
        - objectName: AUTH_SECRET
          key: AUTH_SECRET
        - objectName: AUTH_AZURE_AD_CLIENT_SECRET
          key: AUTH_AZURE_AD_CLIENT_SECRET
        - objectName: AKAMAI_CDN_LIVE_KEY
          key: AKAMAI_CDN_LIVE_KEY
        - objectName: AKAMAI_CDN_VOD_KEY
          key: AKAMAI_CDN_VOD_KEY
        - objectName: FASTLY_CDN_LIVE_KEY
          key: FASTLY_CDN_LIVE_KEY
        - objectName: FASTLY_CDN_VOD_KEY
          key: FASTLY_CDN_VOD_KEY
        - objectName: ATENEA_TOKEN
          key: ATENEA_TOKEN
  parameters:
    roleName: vms
    vaultKubernetesMountPath: aks-unifiedstreaming-pro
    objects: |
      - objectName: "AUTH_SECRET"
        secretPath: "apps_multi/data/vms/pro"
        secretKey: "AUTH_SECRET"
      - objectName: "AUTH_AZURE_AD_CLIENT_SECRET"
        secretPath: "apps_multi/data/vms/pro"
        secretKey: "AUTH_AZURE_AD_CLIENT_SECRET"
      - objectName: "AKAMAI_CDN_LIVE_KEY"
        secretPath: "apps_multi/data/vms/pro"
        secretKey: "AKAMAI_CDN_LIVE_KEY"
      - objectName: "AKAMAI_CDN_VOD_KEY"
        secretPath: "apps_multi/data/vms/pro"
        secretKey: "AKAMAI_CDN_VOD_KEY"
      - objectName: "FASTLY_CDN_LIVE_KEY"
        secretPath: "apps_multi/data/vms/pro"
        secretKey: "FASTLY_CDN_LIVE_KEY"
      - objectName: "FASTLY_CDN_VOD_KEY"
        secretPath: "apps_multi/data/vms/pro"
        secretKey: "FASTLY_CDN_VOD_KEY"
      - objectName: "ATENEA_TOKEN"
        secretPath: "apps_multi/data/vms/pro"
        secretKey: "ATENEA_TOKEN"
