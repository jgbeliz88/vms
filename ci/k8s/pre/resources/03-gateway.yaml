---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: vms-gateway-internal
spec:
  selector:
    istio: int-gateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - vms-pre.azrinternal.mediaset.es
...
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vms
spec:
  hosts:
  - vms-pre.azrinternal.mediaset.es
  gateways:
  - vms-gateway-internal
  http:
  - name:
    match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: vms
        port:
          number: 80
    retries:
      attempts: 3
      perTryTimeout: 5s
      retryOn: gateway-error,connect-failure,refused-stream
...
