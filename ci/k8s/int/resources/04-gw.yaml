---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: __PRJ_NAME__-gateway
  namespace: __PRJ_NAME__
spec:
  selector:
    istio: int-gateway
  servers:
  - port:
      number: 80
      name: http80
      protocol: HTTP
    hosts:
#      - tele5.rwd.int.aws.tele5.int
#      - tele5.preview.rwd.int.aws.tele5.int
  - port:
      number: 81
      name: http81
      protocol: HTTP
    hosts:
#      - tele5.rwd.int.aws.tele5.int
#      - tele5.preview.rwd.int.aws.tele5.int
...
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: __PRJ_NAME__
  namespace: __PRJ_NAME__
spec:
  host: __PRJ_NAME__
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
...
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: __PRJ_NAME__
  namespace: __PRJ_NAME__
spec:
  gateways:
    - __PRJ_NAME__-gateway
  hosts:
#    - tele5.rwd.int.aws.tele5.int
#    - tele5.preview.rwd.int.aws.tele5.int
  http:
    - match:
        - port: 80
      route:
        - destination:
            host: __PRJ_NAME__
            port:
              number: 80
    - match:
        - port: 81
      route:
        - destination:
            host: __PRJ_NAME__
            port:
              number: 81
...