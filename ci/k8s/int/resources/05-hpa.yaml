apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: __PRJ_NAME__
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: __PRJ_NAME__
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu 
      target:
        type: Utilization
        averageUtilization: 80
